name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Check release inputs
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          test -s ".github/releases/${GITHUB_REF_NAME}.md"
          python3 tools/distribution/sync_catalog.py --check
          python3 -B -m unittest discover -s tools/distribution -p 'test_*.py' -v
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -I . tools/safety-tests/native_safety_test.cpp -o /tmp/foxlet-native-safety
          /tmp/foxlet-native-safety
      - name: Test sentence rules with sanitizers
        run: |
          python3 tools/sentence-tests/generate_unicode.py --check
          cmake -S tools/sentence-tests -B build/sentence-tests -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSENTENCE_SANITIZERS=ON
          cmake --build build/sentence-tests --parallel 2
          UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/sentence-tests --output-on-failure
      - name: Build and test delivered SDK and R8 consumer
        run: ./gradlew :foxlet:test :foxlet:assembleRelease :sdk-example:assembleRelease :sdk-example:assembleReleaseAndroidTest
      - name: Verify package contents and hardening
        run: |
          python3 tools/distribution/check_public_api.py
          python3 tools/distribution/check_hardening.py
          python3 tools/distribution/verify_artifacts.py --aar foxlet/build/outputs/aar/foxlet-release.aar --apk sdk-example/build/outputs/apk/release/sdk-example-release.apk
      - name: Prepare versioned release files
        run: |
          mkdir -p release-files device-files
          cp foxlet/build/outputs/aar/foxlet-release.aar "release-files/foxlet-${GITHUB_REF_NAME}.aar"
          cp sdk-example/build/outputs/apk/release/sdk-example-release.apk "release-files/foxlet-sdk-example-${GITHUB_REF_NAME}.apk"
          cp foxlet/build/generated/distributionResources/io/github/yinvoker/foxlet/licenses/*.txt release-files/
          cp sdk-example/build/outputs/apk/release/sdk-example-release.apk device-files/
          cp sdk-example/build/outputs/apk/androidTest/release/sdk-example-release-androidTest.apk device-files/
          cp tools/distribution/run_device_tests.py device-files/
          cd release-files
          sha256sum -- *.aar *.apk *.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-files/
      - uses: actions/upload-artifact@v4
        with:
          name: device-files
          path: device-files/

  # Configure an isolated runner with this label and a connected ARM64 Android
  # device/emulator. Publishing intentionally waits for the actual binary test.
  device:
    needs: build
    runs-on: [self-hosted, android-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: device-files
          path: device-files
      - name: Test exact release APK on Android
        env:
          DEVICE_SERIAL: ${{ vars.FOXLET_ANDROID_SERIAL }}
        run: python3 device-files/run_device_tests.py --serial "$DEVICE_SERIAL" --apk device-files/sdk-example-release.apk --test-apk device-files/sdk-example-release-androidTest.apk --output device-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-result
          path: device-result.json

  publish:
    needs: [build, device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: device-result
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: .github/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
