name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native parser and Unicode safety tests (ASan/UBSan)
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -I . tools/safety-tests/native_safety_test.cpp -o /tmp/foxlet-native-safety
          /tmp/foxlet-native-safety
      - name: Benchmark checker tests (no device timings on shared CI runners)
        run: python3 -B -m unittest discover -s tools/version-bench -p 'test_*.py' -v
      - name: App benchmark evidence checks (synthetic data only)
        run: python3 -B -m unittest discover -s tools/app-bench -p 'test_*.py' -v

  # NDK 交叉编译在 x86 宿主上合法(目标是 arm64);ARM-only 门禁检查的是目标架构。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Validate pinned model catalog
        run: python3 tools/distribution/sync_catalog.py --check
      - name: Unit tests, final AAR, R8 consumer and device-test APK
        run: ./gradlew :bergamot:test :bergamot:packageWithoutPrefixes :demo:assembleRelease :demo:assembleReleaseAndroidTest :sample:assembleDebug
      - name: Check delivered bytes and hardening
        run: |
          python3 tools/distribution/check_hardening.py
          python3 tools/distribution/verify_artifacts.py --aar bergamot/build/outputs/aar/bergamot-release.aar --no-prefixes bergamot/build/outputs/aar/bergamot-no-prefixes-release.aar --apk demo/build/outputs/apk/release/demo-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bergamot-release-aar
          path: bergamot/build/outputs/aar/bergamot-release.aar

  # 主机冒烟工具须在 ARM 宿主构建(与设备同走 ruy/NEON 路径)。
  host-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 标准 macOS runner 可能是 M1，不能假定支持 i8mm。
          - os: macos-latest
            require-i8mm: '0'
          # Linux ARM runner 必须实际执行 i8mm 测试，禁止静默跳过。
          - os: ubuntu-24.04-arm
            require-i8mm: '1'
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux host tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - name: Build smoke CLI
        run: |
          cmake -B build-host -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ARCH=armv8-a \
            -DSSPLIT_USE_INTERNAL_PCRE2=ON -DCOMPILE_TESTS=OFF -DBUILD_SMMLA_TEST=ON
          cmake --build build-host -j 3 --target smoke --target smmla_test
      - name: SMMLA GEMM test set and disabled-backend probe
        env:
          SMMLA_TEST_REQUIRE_I8MM: ${{ matrix.require-i8mm }}
        run: |
          ctest --test-dir build-host --output-on-failure
          BERGAMOT_NO_I8MM=1 ./build-host/tools/smmla-test/smmla_test --killswitch-probe
      - name: Verify i8mm opcodes stay in isolated kernels
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            objdump="$(xcrun -f llvm-objdump)"
            export MATTR=+v9.2a
          else
            objdump="$(command -v llvm-objdump)"
            export MATTR=+i8mm
          fi
          tools/smmla-test/check-opcodes.sh build-host/tools/smoke/smoke "$objdump"
      - name: Translate two sentences with a real model
        run: |
          mkdir -p models/enzh
          python3 - <<'EOF'
          import json, urllib.request, hashlib
          reg = json.load(open('registry.json'))
          m = next(x for x in reg['models'] if x['from'] == 'en' and x['to'] == 'zh-Hans')
          for f in m['files']:
              path = 'models/enzh/' + f['name']
              urllib.request.urlretrieve(f['url'], path)
              assert hashlib.sha256(open(path, 'rb').read()).hexdigest() == f['sha256']
          EOF
          printf 'Hello world.\nThis is a smoke test.\n' | \
            ./build-host/tools/smoke/smoke <(cat <<EOF
          models:
            - $PWD/models/enzh/model.enzh.intgemm.alphas.bin
          vocabs:
            - $PWD/models/enzh/srcvocab.enzh.spm
            - $PWD/models/enzh/trgvocab.enzh.spm
          shortlist:
            - $PWD/models/enzh/lex.50.50.enzh.s2t.bin
            - 1
          beam-size: 1
          normalize: 1.0
          word-penalty: 0
          max-length-break: 128
          mini-batch-words: 1024
          workspace: 128
          max-length-factor: 2.0
          skip-cost: true
          cpu-threads: 0
          quiet: true
          quiet-translation: true
          gemm-precision: int8shiftAlphaAll
          alignment: soft
          EOF
          ) | tee out.txt
          test "$(wc -l < out.txt)" -eq 2
