name: maven-central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, tested GitHub Release tag (for example v0.5.0)
        required: true
        type: string
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: maven-central-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate release tag and publishing credentials
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for name in CENTRAL_USER CENTRAL_PASSWORD SIGNING_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Maven Central secret: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          path: publishing-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36
      - name: Download the existing release and validate its device evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          python3 publishing-tools/tools/distribution/prepare_maven_release.py \
            --source release-source --assets release-assets --tag "$RELEASE_TAG"
      - name: Generate Maven metadata, sources and API documentation
        working-directory: release-source
        run: |
          ./gradlew :foxlet:publishAllPublicationsToLocalPreviewRepository \
            -x :foxlet:bundleReleaseAar -x :foxlet:generateDistributionResources
      - name: Verify Maven artifacts reuse the accepted AAR
        run: |
          python3 publishing-tools/tools/distribution/prepare_maven_release.py \
            --source release-source --assets release-assets --tag "$RELEASE_TAG" --verify-repository
      - name: Sign and publish to Maven Central
        working-directory: release-source
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          ./gradlew -Pfoxlet.publishToCentral=true -PmavenCentralDeploymentValidation=PUBLISHED \
            :foxlet:publishAndReleaseToMavenCentral \
            -x :foxlet:bundleReleaseAar -x :foxlet:generateDistributionResources
      - name: Verify the publicly downloadable Maven artifacts
        working-directory: release-source
        run: |
          version="${RELEASE_TAG#v}"
          base="https://repo.maven.apache.org/maven2/io/github/yinvoke/foxlet-translate/$version"
          local_repo="build/maven-repository/io/github/yinvoke/foxlet-translate/$version"
          mkdir -p build/central-download
          for suffix in .aar .pom .module -sources.jar -javadoc.jar; do
            file="foxlet-translate-$version$suffix"
            curl --fail --location --retry 30 --retry-delay 30 --retry-all-errors \
              "$base/$file" --output "build/central-download/$file"
            cmp "build/central-download/$file" "$local_repo/$file"
          done
